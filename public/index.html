function gaugeDrag(sh, svgSel, field) {
  // pointer on the arc → percent (0 at the left end, 100 at the right end)
  const onDown = (e) => {
    const svg = e.target.closest(svgSel); if (!svg) return;
    e.preventDefault();
    svg.setPointerCapture && svg.setPointerCapture(e.pointerId);
    svg.classList.add('gauge-fast');
    const vb = svg.viewBox.baseVal; const rect = svg.getBoundingClientRect();
    const toPct = (ev) => {

};

/* ---------- onboarding ---------- */
function showOnboarding() {
  D.title = 'Добро пожаловать · Kun';
  $('#main').innerHTML = '';
  openSheet({
    cls: 'sm', label: 'Добро пожаловать в Kun', dismissible: false, state: { name: 'Джамшид' },
    render: (sh) => `<div class="sheet-body"><div class="onb">
<svg class="sunmark" viewBox="0 0 120 70" aria-hidden="true"><defs><radialGradient id="onbGlow"><stop offset="0" stop-color="#FFB27A" stop-opacity=".6"/><stop offset="1" stop-color="#F2883B" stop-opacity="0"/></radialGradient></defs><circle cx="60" cy="56" r="44" fill="url(#onbGlow)"/><path d="M14 58a46 46 0 0 1 92 0" fill="none" stroke="url(#sunGrad)" stroke-width="1.4" stroke-linecap="round"/><path d="M34 58a26 26 0 0 1 52 0" fill="none" stroke="#F2883B" stroke-width="2" stroke-linecap="round"/><circle cx="60" cy="40" r="5" fill="#FFE3C8"/><line x1="4" x2="116" y1="58" y2="58" stroke="rgba(255,236,220,.18)"/></svg>
<h2>Добро пожаловать в&nbsp;Kun</h2>
<p>Kun — «день» по-узбекски. Задачи, покупки, деньги, долги, авто и здоровье — на одной спокойной панели.</p>
<div class="field" style="text-align:left"><label for="onb-name">Как вас зовут?</label><input id="onb-name" class="inp" data-bind="name" value="${esc(sh.st.name)}" maxlength="40" autocomplete="given-name" autofocus></div>
<div class="btns"><button class="btn primary block" data-act="onb-demo">${ic('sparkles')}Начать с демо-данными</button><button class="btn block" data-act="onb-clean">Начать с чистого листа</button></div>
<p class="hint" style="margin:14px 0 0">${S.mode === 'claude' ? 'Данные сохраняются в вашем аккаунте Claude.' : S.mode === 'local' ? 'Данные сохраняются в этом браузере.' : 'Хранилище недоступно — данные не сохранятся после перезагрузки.'}</p>
</div></div>`,
    actions: {
      'onb-demo': (el, e, sh) => finishOnboarding(sh, true),
      'onb-clean': (el, e, sh) => finishOnboarding(sh, false),
    },
  });
}
function finishOnboarding(sh, demo) {
  const name = (sh.st.name || '').trim() || 'Джамшид';
  const data = demo ? makeDemo(name) : emptyData(name);
  replaceAll(data);
  sh.close();
  if (location.hash && location.hash !== '#home') { try { history.replaceState(null, '', '#home'); } catch (e) { location.hash = 'home'; } }
  startApp();
}

/* ---------- quick add & "more" sheets ---------- */
ACT['quick-add'] = () => {
  const items = [['task-new', 'Задача', 'list-checks', 'дело на сегодня или позже'], ['qa-shop', 'Покупка', 'shopping-cart', 'в список покупок'], ['tx-new', 'Операция', 'wallet', 'расход, доход, перевод'], ['car-update', 'Заряд авто', 'battery-charging', 'батарея и пробег'], ['health-add', 'Здоровье', 'heart-pulse', 'шаги, сон, вода'], ['debt-new', 'Долг', 'hand-coins', 'дал или взял']];
  const sh0 = openSheet({
    label: 'Быстро добавить',
    render: () => `${sheetHead('Добавить')}<div class="sheet-body"><div class="more-grid">${items.map(([a, t, i, s]) => `<button class="more-tile" data-act="qa-go" data-v="${a}"><span class="tile" style="--c:#F2883B">${ic(i)}</span><span><div class="t">${t}</div><div class="s">${s}</div></span></button>`).join('')}</div></div>`,
    actions: { 'qa-go': (el, e, sh) => { const a = el.dataset.v; sh.close(); setTimeout(() => ACT[a](el), 120); } },
  });
  return sh0;
};
ACT['qa-shop'] = () => {
  openSheet({
    cls: 'sm', label: 'Покупка', state: { text: '' },
    render: (sh) => { const p = parseShop(sh.st.text); return `${sheetHead('Покупка')}<div class="sheet-body"><div class="field"><label for="qs-t">Что купить?</label><input id="qs-t" class="inp" data-bind="text" value="${esc(sh.st.text)}" placeholder="молоко 2 л" autofocus data-mfocus="1"></div><div class="qa-preview">${p ? `→ <b class="cap">${esc(p.name)}</b> · ${fmtNum(p.quantity, 2, true)} ${esc(p.unit)} · ${esc(p.category)}` : ''}</div></div><div class="sheet-foot"><button class="btn primary" data-act="qs-add" ${p ? '' : 'disabled'}>${ic('plus')}Добавить</button></div>`; },
    actions: { 'qs-add': (el, e, sh) => { if (addShopFromText(sh.st.text)) { toast('Добавлено в покупки'); sh.st.text = ''; const i = sh.panel.querySelector('input'); if (i) { i.value = ''; i.focus(); } sh.update(); } } },
    onKey: (e, sh) => { if (e.key === 'Enter') { e.preventDefault(); sh.def.actions['qs-add'](null, e, sh); } },
  });
};
ACT.more = () => {
  const items = [['debts', 'Долги', 'hand-coins', () => { const g = debtTotals('given'); return g.n ? 'мне должны ' + fmtCompact(g.v, g.cur) : 'нет активных'; }], ['car', 'Авто', 'car-front', () => { const c = carInfo(); return c.pct != null ? `${c.pct}% · ≈ ${fmtNum(c.realKm)} км` : 'нет данных'; }], ['health', 'Здоровье', 'heart-pulse', () => { const h = healthByDay().get(dayKey(new Date())); return h && h.steps != null ? fmtNum(h.steps) + ' шагов' : 'внести данные'; }], ['settings', 'Настройки', 'settings', () => 'профиль, данные, курсы']];
  openSheet({
    label: 'Ещё',
    render: () => `${sheetHead('Ещё')}<div class="sheet-body"><div class="more-grid">${items.map(([r, t, i, s]) => `<button class="more-tile ${curRoute === r ? 'on' : ''}" data-act="more-go" data-v="${r}"><span class="tile" style="--c:#F2883B">${ic(i)}</span><span><div class="t">${t}</div><div class="s">${esc(s())}</div></span></button>`).join('')}</div></div>`,
    actions: { 'more-go': (el, e, sh) => { sh.close(); navTo(el.dataset.v); } },
  });
};

// ---- 16-main.js
/* ================= boot ================= */
let _started = false;
function bootSkeleton(msg) {
  $('#main').innerHTML = `${msg ? `<div class="boot-msg"><span class="spinner"></span>${esc(msg)}</div>` : ''}<div class="boot"><div class="skel" style="grid-column:span 8;height:420px"></div><div class="skel" style="grid-column:span 4;height:420px"></div><div class="skel" style="grid-column:span 4;height:260px"></div><div class="skel" style="grid-column:span 4;height:260px"></div><div class="skel" style="grid-column:span 4;height:260px"></div></div>`;
}
function startApp() {
  S.ver++;
  for (const v of $$('#main > *')) v.remove();
  viewEl = null; curRoute = null;
  go(routeFromHash());
  loadWeather();
  { const rt = S.data.settings.rates; if (rt.source === 'default' || (rt.source === 'cbu' && rt.updatedAt < dayKey(new Date()))) updateRates(false); }
  if (!_started) {
    _started = true;
    setInterval(() => { if (S.data && !D.hidden) loadWeather(); }, 15 * 60 * 1000);
    setInterval(() => { if (S.data && !D.hidden) { S.ver++; render(); } }, 60 * 1000);
  }
}
async function boot() {
  onRM();
  D.body.insertAdjacentHTML('afterbegin', GLOBAL_DEFS);
  renderNow();
  window.addEventListener('hashchange', () => { if (S.data) go(routeFromHash()); });
  window.addEventListener('pagehide', flushNow);
  D.addEventListener('visibilitychange', () => { if (D.hidden) flushNow(); else if (S.data) { S.ver++; render(); } });
  let raw = null;
  const hasClaude = typeof window.claude === 'object' && window.claude !== null && typeof window.claude.use === 'function';
  if (hasClaude) {
    S.mode = 'connecting';
    bootSkeleton('Подключаемся к хранилищу…');
    let store = null;
    try { store = await connectClaude(); } catch (e) { store = null; }
    if (store) {
      try { raw = await store.loadAll(); S.store = store; S.mode = 'claude'; }
      catch (e) { raw = null; S.bootNote = 'Хранилище аккаунта не ответило — данные пока сохраняются в браузере.'; }
    }
  }
  if (S.mode !== 'claude') {
    if (lsAvailable()) { S.mode = 'local'; try { raw = LocalStore.load(); } catch (e) { raw = null; } }
    else S.mode = 'memory';
  }
  if (raw) { S.data = normalize(raw); startApp(); }
  else { $('#main').innerHTML = ''; renderNow(); showOnboarding(); }
}
boot();
